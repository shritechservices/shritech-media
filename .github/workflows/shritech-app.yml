# Publishes the ShriTech AutoPost app to Expo (opens in Expo Go via one fixed QR code).
# Runs ONLY when files inside shritech-app/ change. It never touches media/, the website, Supabase or Cloudflare.
name: ShriTech app to Expo Go
on:
  push:
    branches: [main]
    paths: ['shritech-app/**', '.github/workflows/shritech-app.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: shritech-app, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: shritech-app } }
    steps:
      - uses: actions/checkout@v4
      - name: Check Expo token
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add the EXPO_TOKEN secret first"; exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: shritech-app/package-lock.json }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - run: npm ci
      - name: Link Expo project (first run only)
        run: |
          PID=$(node -e "const a=require('./app.json');process.stdout.write(a.expo?.extra?.eas?.projectId||'')")
          if [ -z "$PID" ]; then eas init --non-interactive --force; fi
          node -e "
            const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));
            const pid=a.expo.extra.eas.projectId; a.expo.updates={url:'https://u.expo.dev/'+pid};
            const sdk=require('expo/package.json').version.split('.')[0]+'.0.0';
            a.expo.runtimeVersion='exposdk:'+sdk; fs.writeFileSync('app.json',JSON.stringify(a,null,2)+'\n');"
      - name: Publish update for Expo Go
        run: eas update --channel main --message "app update" --non-interactive
      - name: Save QR link
        run: |
          PID=$(node -e "process.stdout.write(require('./app.json').expo.extra.eas.projectId)")
          SDK=$(node -e "process.stdout.write(require('expo/package.json').version.split('.')[0]+'.0.0')")
          URL="exp://u.expo.dev/$PID?runtime-version=exposdk%3A$SDK&channel-name=main"
          printf '# Open in Expo Go\n\nScan this QR with Expo Go:\n\n![QR](https://qr.expo.dev/eas-update?projectId=%s&runtimeVersion=exposdk:%s&channel=main)\n\nLink: %s\n\nLast published: %s\n' "$PID" "$SDK" "$URL" "$(date -u)" > EXPO_GO.md
          echo "$URL" > expo-go-url.txt
      - name: Commit project link back
        run: |
          git config user.name "shritech-bot"; git config user.email "actions@users.noreply.github.com"
          git add app.json EXPO_GO.md expo-go-url.txt
          git diff --cached --quiet || (git commit -m "app: publish info [skip ci]" && git pull --rebase -q && git push)
