<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#14532D" />
    <meta name="description" content="ShriTech AutoPost — post to Facebook & Instagram automatically. Schedule reels, auto-reply to comments, manage your team." />
    <title>ShriTech AutoPost</title>
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #F6FBF4; }
      @media (prefers-color-scheme: dark) { body { background: #07100B; } }
      #root { display: flex; height: 100%; flex: 1; }
      .st-load { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .st-logo { font-size: 38px; font-weight: 800; color: #0B2A17; letter-spacing: -0.5px; }
      .st-logo b { color: #16A34A; }
      @media (prefers-color-scheme: dark) { .st-logo { color: #E8F2EC; } .st-logo b { color: #22C55E; } }
      .st-spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid rgba(22,163,74,.2); border-top-color: #EAB308; animation: st 0.9s linear infinite; }
      .st-sub { color: #5E7566; font-size: 14px; }
      @keyframes st { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="st-load"><div class="st-logo">Shri<b>Tech</b></div><div class="st-spin"></div><div class="st-sub">Loading AutoPost…</div><a id="st-retry" href="#" style="display:none;margin-top:6px;padding:10px 18px;border-radius:12px;background:#16a34a;color:#fff;text-decoration:none;font-weight:600">Taking long? Tap to reload</a></div></div>
    <script>setTimeout(function(){var b=document.getElementById("st-retry");if(b){b.style.display="inline-block";b.onclick=function(e){e.preventDefault();try{caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}catch(x){}location.replace(location.pathname+"?r="+Date.now())}}},12000);</script>
  </body>
</html>
